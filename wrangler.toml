# =============================================================
# Konfigurasi Cloudflare — Platform PjBL SPtLDV (SMK Tata Boga)
# Frontend di-serve sebagai Workers Static Assets (satu Worker
# untuk API + SPA). Database: Cloudflare D1. Berkas: Cloudflare R2.
# =============================================================

name = "pjbl-sptldv-tata-boga"
main = "worker/index.ts"
compatibility_date = "2024-09-23"

# ---- Static Assets (hasil `npm run build` → client-dist/) ----
# Semua rute selain /api/* disajikan sebagai aset statis dengan
# fallback single-page-application (index.html).
[assets]
directory = "./client-dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# ---- Cloudflare D1 ----
# Buat dulu:  wrangler d1 create pjbl-sptldv
# Lalu isi database_id di bawah, dan jalankan:
#   wrangler d1 execute pjbl-sptldv --remote --file=./schema.sql
[[d1_databases]]
binding = "DB"
database_name = "pjbl-sptldv"
database_id = "GANTI-DENGAN-ID-D1-ANDA"

# ---- Cloudflare R2 ----
# Buat dulu:  wrangler r2 bucket create pjbl-sptldv-files
[[r2_buckets]]
binding = "R2"
bucket_name = "pjbl-sptldv-files"

# Catatan limit:
#  - Ukuran ungualan maksimum Worker: 100 MB (portofolio 50 MB, jurnal 10 MB → aman)
#  - D1 & R2 tersedia di paket gratis
